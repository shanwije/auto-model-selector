[project]
name = "auto-model-selector"
version = "0.1.0"
description = "Task-aware model routing for Claude Code: an advisory UserPromptSubmit hook plus a launch-time CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The Haiku-based fallback classifier is optional. Without it the tool runs on
# heuristics alone and still works fully.
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.11", "ruff>=0.6"]

[project.scripts]
route = "auto_model_selector.cli:main"
ams-hook = "auto_model_selector.hook:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_model_selector"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-q --cov=auto_model_selector --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":', "raise SystemExit"]
